      <path d="M22 18 L14 18 M18 14 L14 18 L18 22" stroke="#174276" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
    
      
    <g id="hamburger-menu" data-name="Hamburger Menu" transform="translate(339, 18)" cursor="pointer">
