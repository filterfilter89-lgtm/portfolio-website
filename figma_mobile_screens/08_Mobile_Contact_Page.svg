    <clipPath id="video-reel-clip"><rect width="146.13" height="259.77" rx="6" /></clipPath>
    

  </defs>
  <g id="08 - Dedicated Contact Page">
    
    <rect width="393" height="852" fill="#fff7ed" />
    <g id="artboard-viewport">
      
    <g id="back-arrow" data-name="Back Arrow" transform="translate(18, 18)" cursor="pointer">
